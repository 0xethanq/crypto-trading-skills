name: Validate Skills & Manifests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skills, licenses, and plugin manifests
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          skills_dir = root / 'skills'
          dirs = sorted(p for p in skills_dir.iterdir() if p.is_dir())
          assert len(dirs) == 95, f'Expected 95 skill dirs, found {len(dirs)}'

          for d in dirs:
              skill_md = d / 'SKILL.md'
              assert skill_md.is_file(), f'Missing {skill_md}'
              assert (d / 'LICENSE').is_file() or (d / 'LICENSE.md').is_file(), f'Missing LICENSE in {d}'
              txt = skill_md.read_text(encoding='utf-8')
              assert txt.startswith('---') and txt.count('---') >= 2, f'Invalid frontmatter fence in {skill_md}'
              fm = txt.split('---', 2)[1]
              assert re.search(r'(?m)^name\s*:\s*\S+', fm), f'Missing name in {skill_md}'
              assert re.search(r'(?m)^description\s*:', fm), f'Missing description in {skill_md}'

          catalog = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          assert catalog['stats']['bundledSkills'] == 95

          claude = json.loads((root / '.claude-plugin' / 'marketplace.json').read_text(encoding='utf-8'))
          covered = set()
          for plugin in claude['plugins']:
              for rel in plugin['skills']:
                  target = (root / rel).resolve()
                  assert (target / 'SKILL.md').is_file(), f'Broken Claude plugin skill path: {rel}'
                  covered.add(target.name)
          assert covered == {d.name for d in dirs}, 'Claude marketplace missing or extra skill paths'

          cursor_plugin = json.loads((root / '.cursor-plugin' / 'plugin.json').read_text(encoding='utf-8'))
          assert re.fullmatch(r'[a-z0-9]([a-z0-9.-]*[a-z0-9])?', cursor_plugin['name'])

          cursor_mp = json.loads((root / '.cursor-plugin' / 'marketplace.json').read_text(encoding='utf-8'))
          for entry in cursor_mp['plugins']:
              assert set(entry.keys()) <= {'name', 'source', 'description', 'minClientVersions'}, entry

          print(f'Validated {len(dirs)} skills, {len(claude["plugins"])} Claude plugins, and Cursor manifests.')
          PY
